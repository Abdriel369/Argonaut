# LAPTOP 3 · orquestador + modelo de riesgo solar (en su propio contenedor)
# Arranque:  cp .env.example .env   y luego   docker compose up --build
name: astro-laptop3

services:
  orquestador:
    build:
      context: ..
      dockerfile: laptop3-orquestador/Dockerfile.orquestador
    image: astro-laptop3-orquestador:local
    restart: unless-stopped
    ports:
      - "${PUERTO_ORQUESTADOR:-8300}:8300"     # la Laptop 1 llama aquí
    environment:
      URL_GATEWAY: "http://${IP_LAPTOP2}:${PUERTO_GATEWAY:-8200}"   # Laptop 2
      URL_MODELO_SOLAR: "http://modelo-solar:8310"                  # local, en esta laptop
      TIEMPO_MAX_MODELO_S: "${TIEMPO_MAX_MODELO_S:-3}"
      NIVEL_LOG: "${NIVEL_LOG:-INFO}"
    depends_on:
      modelo-solar: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/salud', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  modelo-solar:
    build:
      context: ..
      dockerfile: laptop3-orquestador/Dockerfile.solar
    image: astro-laptop3-solar:local
    restart: unless-stopped
    environment:
      USAR_GPU: "${USAR_GPU:-auto}"
    # GPU NVIDIA (quitar el comentario si la laptop tiene una y el runtime de NVIDIA instalado):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - {driver: nvidia, count: all, capabilities: [gpu]}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8310/salud', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
