[indicadores.ejercicio_min]
fuente = "Principio respaldado por [F4] Agencia Espacial Canadiense (unas dos horas de ejercicio al día en misiones largas; pérdida media de 1 % de densidad ósea al mes) y [F1] NASA-STD-3001 Vol. 1 Rev. C [V1 4024] y [V1 4027] (mantener fuerza muscular y densidad ósea). Los porcentajes y los días son cortes de diseño propio."
