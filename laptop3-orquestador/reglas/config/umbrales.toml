# ----------------------------------------------------------------------------
# NIVEL 2 · Reglas por combinación
# ----------------------------------------------------------------------------

[combinaciones.FATIGA]
fuente = "Principio respaldado por [F2] Watson et al. 2015 (dormir menos de 7 h se asocia a peor rendimiento y más errores) y [F9] Basner et al. 2014 (salud conductual en confinamiento prolongado). La combinación y sus números son cortes de diseño propio."
consecuencia = "Esta combinación puede causar fatiga: menos atención, reflejos lentos y más errores."
titulo = "Riesgo de fatiga"
protocolo_id = "fatiga"
margen_sueno_h = 0.4            # "sueño bajo la base": al menos 0.4 h menos que tu normal
dias_sueno_bajo = 3             # durante 3 días seguidos
estres_sobre_base = 20.0        # estrés alto: 20 puntos sobre tu normal
ejercicio_pct_plan = 120.0      # ejercicio alto: 120 % del plan o más
caida_animo = 2.0               # sube a ROJO si además el ánimo cae 2 puntos
# Números de la regla: cortes de diseño propio (ver `fuente`).

[combinaciones.AISLAMIENTO]
fuente = "Principio respaldado por [F9] Basner et al. 2014 (PLoS ONE, simulación de 520 días): el confinamiento prolongado afecta la salud conductual de forma distinta en cada tripulante. La combinación y sus números son cortes de diseño propio."
consecuencia = "Es una señal frecuente de aislamiento en misiones largas y conviene atenderla pronto."
titulo = "Señales de aislamiento"
protocolo_id = "aislamiento"
dias_animo_bajando = 4          # ánimo bajando 4 días
cohesion_baja = 2.5             # cohesión del equipo en 2.5 o menos (escala 1-5)
# Números de la regla: cortes de diseño propio (ver `fuente`).

[combinaciones.PERDIDA_MUSCULAR_OSEA]
fuente = "Principio respaldado por [F4] Agencia Espacial Canadiense (unas dos horas de ejercicio al día en misiones largas; pérdida media de 1 % de densidad ósea al mes) y [F1] NASA-STD-3001 Vol. 1 Rev. C [V1 4024] y [V1 4027] (mantener fuerza muscular y densidad ósea). Los porcentajes y los días son cortes de diseño propio."
consecuencia = "En microgravedad eso acelera la pérdida de músculo y de hueso."
titulo = "Riesgo de pérdida muscular y ósea"
protocolo_id = "muscular_oseo"
ejercicio_pct_plan = 50.0       # menos del 50 % del plan
dias = 5                        # 5 días seguidos -> naranja
dias_aviso = 3                  # 3 días seguidos -> amarillo
dias_mision_larga = 14          # a partir de este día de misión basta un día menos
# Números de la regla: cortes de diseño propio (ver `fuente`).

[combinaciones.RADIACION]
fuente = "Principio respaldado por [F6] Berger et al. 2017 (dosis equivalente de hasta 647 µSv/día dentro de la ISS, unos 27 µSv/h) y [F1] NASA-STD-3001 Vol. 1 Rev. C [V1 4031] (protección ante eventos de partículas solares). Los cortes en µSv/h son cortes de diseño propio."
consecuencia = "Hay que reducir la exposición cuanto antes."
titulo = "Exposición a radiación"
protocolo_id = "radiacion"
tasa_alta_usv_h = 200.0         # tasa de dosis alta
fc_sobre_base_pct = 10.0        # "pulso elevado" para esta regla
temperatura_sobre_base = 0.8    # "temperatura elevada" para esta regla
# Números de la regla: cortes de diseño propio (ver `fuente`).

[combinaciones.CARDIOVASCULAR]
fuente = "FUENTE POR CITAR · candidata [F10] Baevsky et al. 2007 (J Appl Physiol): solo se pudo abrir el resumen, no el artículo. No cuenta como verificada (ver FUENTES.md)."
consecuencia = "Juntas, estas señales indican que tu corazón está trabajando de más."
titulo = "Señales de sobrecarga del corazón"
protocolo_id = "cardiovascular"
fc_sobre_base_pct = 15.0        # pulso en reposo +15 %
hrv_bajo_base_pct = 20.0        # HRV 20 % bajo tu normal
sueno_pobre_h = 1.0             # sueño medio de 3 días al menos 1 h bajo tu normal
# FUENTE POR CITAR (NASA HRP: riesgo cardiovascular; desplazamiento de fluidos en microgravedad)

[combinaciones.ENERGIA_BAJA]
fuente = "Principio respaldado por [F1] NASA-STD-3001 Vol. 1 Rev. C [V1 4020] (dar el 100 % de las necesidades de nutrientes y energía) y [F5] Smith y Zwart, NASA (ingesta media observada en la ISS: 74 % de lo recomendado). Los cortes de 75 % y 60 % son cortes de diseño propio."
consecuencia = "Sin suficiente comida te faltará energía para trabajar y entrenar."
