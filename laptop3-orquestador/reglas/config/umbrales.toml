# ============================================================================
# UMBRALES Y PESOS DEL MOTOR DE REGLAS  ·  VALORES DE EJEMPLO
# ============================================================================
# Ningún número de este archivo es una recomendación médica. Son valores de
# ejemplo para el prototipo. Antes de cualquier uso serio hay que sustituirlos
# por valores revisados.
#
# FUENTES. Cada bloque lleva un campo `fuente`. Las referencias completas [F1]..[F10]
# (autores, título, revista o editor, año, DOI o URL, fecha de consulta y licencia)
# están en FUENTES.md, en la raíz del repositorio. Reglas:
#   - No se inventan citas, números, páginas ni enlaces, y no se cita de memoria.
#     Una fuente solo cuenta si se abrió el documento y se comprobó el pasaje.
#   - "Principio respaldado por [Fn]; corte de diseño propio": la fuente respalda
#     la idea, pero el número del umbral NO aparece en ella. Lo eligió el equipo.
#   - `fuente = "FUENTE POR CITAR ..."`: el umbral no tiene fuente verificada. Si
#     nombra una candidata, es una pista que no se pudo abrir completa.
#   - Los cortes del tipo "1 h bajo la base = amarillo" son decisiones de diseño.
#     Ninguno es un valor copiado de una norma o de un artículo.
#   - Verificada por el equipo: NASA-STD-3001 Vol. 1 [V1 4030] (600 mSv de carrera).
#     Las demás las abrió y comprobó el asistente el 2026-11-15 (detalle en FUENTES.md).
# ============================================================================

[general]
fuente = "Principio respaldado por [F7] Wood et al. 2011 (NASA): el mareo espacial dura en general 2-3 días en vuelo. El valor de 2 días y el factor 1.5 son cortes de diseño propio."
# Ventana de adaptación: los primeros días el cuerpo se ajusta a la microgravedad
# y los umbrales relativos a la línea base se hacen más tolerantes.
dias_adaptacion = 2
factor_tolerancia_adaptacion = 1.5   # corte de diseño propio (ver `fuente`)

# ----------------------------------------------------------------------------
# NIVEL 1 · Reglas por indicador contra la línea base, con persistencia
# ----------------------------------------------------------------------------
# sentido:    "bajo" = preocupa cuando baja; "alto" = preocupa cuando sube.
# medida:     "absoluta"   -> diferencia con la referencia, en la unidad del indicador
#             "porcentual" -> diferencia con la referencia, en %
#             "valor"      -> se compara el valor directamente (sin línea base)
# referencia: "base" (línea base personal), "plan" (meta planificada) o "ninguna".
# amarillo / naranja / rojo: cuánto debe alejarse para llegar a ese nivel.
# persistencia_dias: si lleva tantos días seguidos fuera de rango, sube un escalón.
# tolerante:  si se relaja durante la ventana de adaptación.

[indicadores.sueno_h]
fuente = "Principio respaldado por [F2] Watson et al. 2015 (consenso AASM/SRS): los adultos deben dormir 7 h o más por noche. Los cortes relativos a la línea base son cortes de diseño propio."
decimales = 1
frase = "dormiste {valor} h (tu normal son {referencia} h)"
consecuencia = "Con poco sueño baja la atención y es más fácil cometer errores."
nombre = "Sueño"
unidad = "h"
sentido = "bajo"
medida = "absoluta"
referencia = "base"
amarillo = 1.0        # 1 h menos que tu normal   · corte de diseño propio
naranja = 2.5
rojo = 3.5
persistencia_dias = 3
tolerante = true
alerta_id = "SUENO_BAJO"
titulo = "Estás durmiendo menos de lo normal"
protocolo_id = "sueno"

[indicadores.animo]
fuente = "Principio respaldado por [F9] Basner et al. 2014 (PLoS ONE, simulación de 520 días): el confinamiento prolongado afecta la salud conductual de forma distinta en cada tripulante. La escala y los cortes son cortes de diseño propio."
decimales = 0
frase = "tu ánimo está bajo ({valor} de 5)"
consecuencia = "Un ánimo bajo sostenido quita energía y afecta la convivencia con el equipo."
nombre = "Ánimo"
unidad = "1-5"
sentido = "bajo"
medida = "absoluta"
referencia = "base"
amarillo = 2.0        # 2 puntos menos en escala 1-5 · corte de diseño propio
naranja = 3.0
persistencia_dias = 3
tolerante = false
alerta_id = "ANIMO_BAJO"
titulo = "Tu ánimo está bajo"
protocolo_id = "animo_estres"

[indicadores.estres]
fuente = "Principio respaldado por [F9] Basner et al. 2014 (PLoS ONE, simulación de 520 días): el confinamiento prolongado afecta la salud conductual de forma distinta en cada tripulante. La escala de 0 a 100 y los cortes son cortes de diseño propio."
decimales = 0
frase = "tu estrés está alto ({valor} de 100)"
consecuencia = "El estrés alto sostenido cansa, quita sueño y dificulta concentrarse."
nombre = "Estrés"
unidad = "0-100"
sentido = "alto"
medida = "absoluta"
referencia = "base"
