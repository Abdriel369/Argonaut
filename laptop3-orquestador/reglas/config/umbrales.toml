[contexto.dosis_acumulada]
fuente = "[F1] NASA-STD-3001 Vol. 1 (Crew Health), requisito [V1 4030]: la dosis efectiva total de carrera por radiación espacial debe ser menor a 600 mSv (basada en 3 % REID de mortalidad por cáncer). Los cortes 50 / 150 / 250 mSv NO están en la norma: son escalones internos de diseño hacia ese límite (cortes de diseño propio)."
consecuencia = "Conviene limitar exposiciones adicionales y avisar al equipo médico."
titulo = "Radiación acumulada en la misión"
protocolo_id = "radiacion"
alerta_id = "DOSIS_ACUMULADA"
limite_norma_msv = 600.0        # límite de carrera de la norma, [V1 4030]. Las reglas no lo usan: es la referencia.
# Escalones internos de diseño hacia ese límite (no son valores de la norma):
amarillo = 50.0                 # mSv acumulados · aprox. 8 % del límite de carrera
naranja = 150.0                 # 25 % del límite de carrera
rojo = 250.0                    # aprox. 42 % del límite de carrera
