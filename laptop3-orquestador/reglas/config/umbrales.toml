[indicadores.ingesta_pct]
fuente = "Principio respaldado por [F1] NASA-STD-3001 Vol. 1 Rev. C [V1 4020] (dar el 100 % de las necesidades de nutrientes y energía) y [F5] Smith y Zwart, NASA (ingesta media observada en la ISS: 74 % de lo recomendado). Los cortes de 75 % y 60 % son cortes de diseño propio."
