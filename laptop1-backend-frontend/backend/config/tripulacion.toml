# ============================================================================
# TRIPULACIÓN SIMULADA Y PARÁMETROS DEL ÍNDICE DE PREPARACIÓN
# ============================================================================
# Todos los datos son ficticios y simulados. Este archivo NO describe personas
# reales ni contiene recomendaciones médicas.
#
# AST-01 conserva exactamente su perfil (perfil.toml) y su guion
# (guion_7_dias.toml). Los otros cinco se definen aquí con valores deterministas:
# el mismo día y la misma semilla dan siempre el mismo resultado.
# ============================================================================

# ----------------------------------------------------------------------------
# Índice de preparación (Readiness). Los pesos y los topes son cortes de diseño
# propio del prototipo; no son una probabilidad calibrada ni una evaluación
# médica. La fórmula está documentada en SUPUESTOS.md y en el Anexo B del encargo.
# ----------------------------------------------------------------------------
[preparacion]
peso_indicadores = 0.40
peso_plan = 0.25
peso_seguridad = 0.20
peso_datos = 0.15

# Puntaje de cada nivel para el bloque de indicadores.
puntaje_verde = 100.0
puntaje_amarillo = 60.0
puntaje_naranja = 25.0
puntaje_rojo = 0.0

# Riesgo asociado al peor nivel de las reglas para el bloque de seguridad.
riesgo_verde = 0.00
riesgo_amarillo = 0.25
riesgo_naranja = 0.55
riesgo_rojo = 0.85

# Topes del índice cuando hay una alerta grave.
tope_rojo = 45.0
tope_naranja = 70.0

# Sin cobertura suficiente, o con demasiados indicadores principales sin dato,
# el índice es null: nunca se muestra un cero engañoso.
cobertura_minima = 0.5
faltantes_principales_maximos = 2

# Indicadores principales del bloque de indicadores.
principales = ["sueno_h", "animo", "estres", "ejercicio_min", "fc_reposo", "hrv"]

# Pesos internos del bloque de plan (Anexo B).
plan_peso_sueno = 0.40
plan_peso_ejercicio = 0.30
plan_peso_ingesta = 0.30

# Proyección heurística: horizonte máximo para informar "días para la base".
proyeccion_horizonte_dias = 14
proyeccion_max_puntos = 7

